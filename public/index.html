<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YouTube Transcriber — synced TXT / SRT / VTT</title>
<style>
  :root { color-scheme: light dark; --border: #ccc; --muted: #666; --error: #b00020; }
  @media (prefers-color-scheme: dark) {
    :root { --border: #444; --muted: #aaa; --error: #ff98a5; }
  }
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; margin: .75rem 0; align-items: end; }
  label { font-size: .85rem; display: block; margin-bottom: .2rem; }
  .field { display: flex; flex-direction: column; }
  .grow { flex: 1 1 320px; }
  input[type=text] { padding: .6rem; font-size: 1rem; width: 100%; box-sizing: border-box; }
  select, button { padding: .6rem .9rem; font-size: 1rem; }
  button { cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #error { color: var(--error); white-space: pre-wrap; }
  #meta { color: var(--muted); font-size: .9rem; }
  #preview { border: 1px solid var(--border); border-radius: 8px; max-height: 420px; overflow: auto; margin-top: 1rem; }
  .cue { display: flex; gap: .75rem; padding: .45rem .75rem; border-bottom: 1px solid var(--border); align-items: baseline; content-visibility: auto; contain-intrinsic-size: auto 3rem; }
  .cue:last-child { border-bottom: none; }
  .cue time { font-variant-numeric: tabular-nums; font-family: ui-monospace, monospace; font-size: .85rem; white-space: nowrap; }
  .cue time a { text-decoration: none; }
  .cue span { min-width: 0; overflow-wrap: anywhere; }
  .notebar { padding: .6rem .75rem; color: var(--muted); font-size: .9rem; border-bottom: 1px solid var(--border); }
  .notebar button { padding: .3rem .6rem; font-size: .9rem; margin-left: .5rem; }
  iframe { width: 100%; aspect-ratio: 16/9; border: 1px solid var(--border); border-radius: 8px; margin-top: 1rem; }
  .hint { color: var(--muted); font-size: .9rem; }
  code { font-size: .9em; }
</style>
</head>
<body>
<h1>YouTube Transcriber</h1>
<p class="hint">Paste a YouTube URL → preview the synced transcript → download <code>.txt</code> (readable), <code>.srt</code> (VLC/Premiere) or <code>.vtt</code> (web player).</p>

<div class="row">
  <div class="field grow">
    <label for="input">YouTube URL or video ID</label>
    <input id="input" type="text" placeholder="https://www.youtube.com/watch?v=… or youtu.be/… or 11-char ID" autofocus />
  </div>
</div>
<div class="row">
  <div class="field">
    <label for="lang">Caption language</label>
    <select id="lang"><option value="">Auto (first available)</option></select>
  </div>
  <div class="field">
    <label for="langManual">Or type a code</label>
    <input id="langManual" type="text" placeholder="en, es, fr…" style="max-width:180px" />
  </div>
  <div>
    <button id="langs">List languages</button>
    <button id="fetch">Get transcript</button>
  </div>
</div>
<div class="row">
  <button id="dlTxt" disabled>Download .txt</button>
  <button id="dlSrt" disabled>Download .srt</button>
  <button id="dlVtt" disabled>Download .vtt</button>
</div>

<p id="error" role="alert"></p>
<p id="meta" aria-live="polite"></p>
<iframe id="player" hidden title="YouTube player" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
<div id="preview"></div>

<script>
const $ = (id) => document.getElementById(id);
const PREVIEW_LIMIT = 1500;
let state = { videoId: null, lang: null, cues: [], showAll: false };
let requestSeq = 0;   // bumped by every fetch; late losers write nothing
let fetchBusy = false;
let lastBlobUrl = null;
function revokeLastBlob() {
  if (lastBlobUrl) {
    try { URL.revokeObjectURL(lastBlobUrl); } catch {}
    lastBlobUrl = null;
  }
}
window.addEventListener("pagehide", revokeLastBlob);

function fmtClock(sec) {
  const t = Math.max(0, Math.floor(sec));
  const h = String(Math.floor(t / 3600)).padStart(2, "0");
  const m = String(Math.floor((t % 3600) / 60)).padStart(2, "0");
  const s = String(t % 60).padStart(2, "0");
  return `${h}:${m}:${s}`;
}
function ytLink(videoId, sec) {
  return `https://www.youtube.com/watch?v=${videoId}&t=${Math.floor(sec)}s`;
}
function showError(msg) { $("error").textContent = msg || ""; }
function setDownloadsEnabled(on) {
  for (const b of [$("dlTxt"), $("dlSrt"), $("dlVtt")]) b.disabled = !on;
}
function resetView() {
  const player = $("player");
  player.hidden = true;
  player.removeAttribute("src");
  setDownloadsEnabled(false);
}
function effectiveLang() {
  return $("langManual").value.trim() || $("lang").value.trim();
}

async function listLangs() {
  showError("");
  const input = $("input").value.trim();
  if (!input) return showError("Paste a YouTube URL or video ID first.");
  const my = ++requestSeq;
  $("langs").disabled = true;
  $("meta").textContent = "Listing languages…";
  try {
    const r = await fetch(`/api/tracks?input=${encodeURIComponent(input)}`);
    const data = await r.json();
    if (my !== requestSeq) return;
    if (!r.ok) throw new Error(data.error || "Failed to list languages.");
    const sel = $("lang");
    sel.innerHTML = `<option value="">Auto (first available)</option>`;
    // Dedupe by code: the server fetches the first matching track, so the
    // dropdown must not advertise two different tracks under one value.
    const seen = new Map();
    for (const t of data.tracks) {
      if (!seen.has(t.languageCode)) {
        seen.set(t.languageCode, { name: t.name, auto: t.isAutoGenerated, alsoAuto: false, alsoManual: false });
      } else if (t.isAutoGenerated) {
        seen.get(t.languageCode).alsoAuto = true;
      } else {
        seen.get(t.languageCode).alsoManual = true;
      }
    }
    for (const [code, e] of seen) {
      const o = document.createElement("option");
      o.value = code;
      const extra = e.auto
        ? e.alsoManual ? " (auto + manual available)" : " (auto)"
        : e.alsoAuto ? " (+ auto-generated available)" : "";
      o.textContent = `${code} — ${e.name}${extra}`;
      sel.appendChild(o);
    }
    $("meta").textContent = data.tracks.length
      ? `${seen.size} caption language(s) found for ${data.videoId}.`
      : `No caption tracks found for ${data.videoId}.`;
  } catch (e) {
    if (my !== requestSeq) return;
    showError(e.message);
    // Don't leave options/meta from a previous video on failure.
    $("lang").innerHTML = `<option value="">Auto (first available)</option>`;
    $("meta").textContent = "";
  }
  finally {
    $("langs").disabled = false;
    if (!fetchBusy) $("fetch").disabled = false; // a superseding fetch owns its button
  }
}

function renderPreview() {
  const box = $("preview");
  box.innerHTML = "";
  const cues = state.cues;
  const shown = (!state.showAll && cues.length > PREVIEW_LIMIT) ? cues.slice(0, PREVIEW_LIMIT) : cues;
  if (cues.length > shown.length) {
    const bar = document.createElement("div");
    bar.className = "notebar";
    bar.textContent = `Showing first ${shown.length} of ${cues.length} cues (downloads include all).`;
    const btn = document.createElement("button");
    btn.textContent = `Show all ${cues.length}`;
    btn.addEventListener("click", () => { state.showAll = true; renderPreview(); });
    bar.appendChild(btn);
    box.appendChild(bar);
  }
  const frag = document.createDocumentFragment();
  for (const c of shown) {
    const div = document.createElement("div");
    div.className = "cue";
    const time = document.createElement("time");
    time.setAttribute("datetime", `PT${Math.max(0, Math.floor(c.start))}S`);
    const a = document.createElement("a");
    a.href = ytLink(state.videoId, c.start);
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = fmtClock(c.start);
    time.appendChild(a);
    const span = document.createElement("span");
    span.textContent = c.text; // textContent: caption HTML stays inert
    div.appendChild(time);
    div.appendChild(span);
    frag.appendChild(div);
  }
  box.appendChild(frag);
}

async function fetchTranscript() {
  if (fetchBusy) return; // Enter-key / double-click re-entry: ignore
  showError("");
  const input = $("input").value.trim();
  if (!input) return showError("Paste a YouTube URL or video ID first.");
  const lang = effectiveLang();
  const my = ++requestSeq;
  fetchBusy = true;
  $("fetch").disabled = true;
  $("meta").textContent = "Fetching…";
  // Clear synchronously while this request owns the UI: if a listLangs call
  // supersedes us, nothing stale (preview, player, downloads, state) remains.
  state = { videoId: null, lang: null, cues: [], showAll: false };
  resetView();
  $("preview").innerHTML = "";
  try {
    const r = await fetch(`/api/transcript?input=${encodeURIComponent(input)}${lang ? `&lang=${encodeURIComponent(lang)}` : ""}`);
    const data = await r.json();
    if (my !== requestSeq) return; // superseded
    if (!r.ok) throw new Error(data.error || "Failed to fetch transcript.");
    state = { videoId: data.videoId, lang: data.lang, cues: data.cues, showAll: false };
    $("meta").textContent = `${data.count} cues · video ${data.videoId} · lang ${data.lang}`;
    const player = $("player");
    player.hidden = false;
    player.src = `https://www.youtube.com/embed/${data.videoId}`;
    renderPreview();
    setDownloadsEnabled(true);
  } catch (e) {
    if (my !== requestSeq) return;
    showError(e.message);
    $("meta").textContent = "";
    state = { videoId: null, lang: null, cues: [], showAll: false };
    resetView();
  }
  finally {
    fetchBusy = false;
    // Unconditional: a superseding listLangs owns the shared meta/error line,
    // and any in-flight duplicate is token-discarded, so no stuck buttons.
    $("fetch").disabled = false;
    $("langs").disabled = false;
  }
}

async function download(format) {
  showError("");
  // Download exactly what the preview shows, not whatever is in the form now.
  if (!state.videoId) return showError("Fetch a transcript first, then download.");
  const snap = { videoId: state.videoId, lang: state.lang };
  setDownloadsEnabled(false);
  try {
    const r = await fetch(`/api/download?input=${encodeURIComponent(snap.videoId)}&lang=${encodeURIComponent(snap.lang)}&format=${format}`);
    if (!r.ok) {
      const data = await r.json().catch(() => ({}));
      throw new Error(data.error || "Download failed.");
    }
    // The preview may have moved on while we waited: only save when this
    // download still matches what is shown.
    if (state.videoId !== snap.videoId || state.lang !== snap.lang) return;
    const blob = await r.blob();
    if (state.videoId !== snap.videoId || state.lang !== snap.lang) return;
    let name = `${snap.videoId}_${snap.lang}.${format}`;
    const cd = r.headers.get("Content-Disposition") || "";
    const m = cd.match(/filename="([^"]+)"/);
    if (m) name = m[1];
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    // Track this URL; revoke it lazily (the save dialog may read it after
    // the picker closes). Each timer revokes only its own URL, so a newer
    // download is never killed by an older timer — and no URL leaks.
    const url = a.href;
    lastBlobUrl = url;
    setTimeout(() => {
      try { URL.revokeObjectURL(url); } catch {}
      if (lastBlobUrl === url) lastBlobUrl = null;
    }, 60000);
  } catch (e) {
    // Only report when the preview hasn't moved on to a newer fetch.
    if (state.videoId === snap.videoId && state.lang === snap.lang) showError(e.message);
  }
  finally {
    // Only re-enable when the state we downloaded for is still current.
    if (state.videoId === snap.videoId && state.lang === snap.lang) setDownloadsEnabled(true);
  }
}

$("langs").addEventListener("click", listLangs);
$("fetch").addEventListener("click", fetchTranscript);
$("dlTxt").addEventListener("click", () => download("txt"));
$("dlSrt").addEventListener("click", () => download("srt"));
$("dlVtt").addEventListener("click", () => download("vtt"));
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter") fetchTranscript(); });
</script>
</body>
</html>
